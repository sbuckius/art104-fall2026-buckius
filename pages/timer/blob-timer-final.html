<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blob Timer — 60 seconds</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171029;
    --cream:#FFF6E8;
    --butter:#FFD34E;
    --magenta:#FF5FA2;
    --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
    --data:'Space Mono','SFMono-Regular',ui-monospace,monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}

  body{
    margin:0;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:#120B1F;
    font-family:var(--display);
    -webkit-font-smoothing:antialiased;
  }

  .timer{
    --size:300px;
    --fit:min(var(--size), calc(100vw - 40px), calc(100vh - 130px));
    position:relative;
    width:var(--fit);
    height:var(--fit);
    border-radius:26px;
    border:4px solid var(--ink);
    background:radial-gradient(125% 100% at 50% 4%, #3E7A55 0%, #1E4A33 48%, #12261E 100%);
    box-shadow:0 9px 0 var(--ink), 0 20px 38px rgba(0,0,0,.5);
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }

  .bg{
    position:absolute;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity .45s ease;
  }

  .scrim{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
      linear-gradient(to top, rgba(18,11,31,.62) 0%, rgba(18,11,31,0) 30%),
      radial-gradient(72% 62% at 50% 44%, rgba(18,11,31,0) 38%, rgba(18,11,31,.5) 100%);
  }

  .timer canvas{
    position:absolute;
    inset:0;
    z-index:2;
    display:block;
    width:100%;
    height:100%;
  }

  .flash{
    position:absolute;
    inset:0;
    z-index:3;
    background:radial-gradient(60% 50% at 50% 46%, #FFF0B0 0%, rgba(255,240,176,0) 72%);
    opacity:0;
    pointer-events:none;
  }
  .flash.is-on{animation:flash-out .5s ease-out forwards;}
  @keyframes flash-out{0%{opacity:.62;}100%{opacity:0;}}

  .readout{
    position:absolute;
    top:11px;
    left:50%;
    z-index:4;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--data);
    font-size:23px;
    line-height:1;
    padding:7px 13px 6px;
    border-radius:11px;
    border:3px solid var(--ink);
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
    transform:translateX(-50%) rotate(-2deg);
    font-variant-numeric:tabular-nums;
    transition:background-color .18s ease,transform .18s ease;
  }
  .readout.is-urgent{background:var(--butter);transform:translateX(-50%) rotate(2deg) scale(1.07);}
  .readout.is-done{background:var(--magenta);color:var(--cream);}

  .swap{
    position:absolute;
    top:11px;
    left:11px;
    z-index:4;
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border:3px solid var(--ink);
    border-radius:50%;
    background:var(--cream);
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 3px 0 var(--ink);
    transition:transform .08s ease,box-shadow .08s ease,background-color .15s ease;
  }
  .swap:hover{background:var(--butter);}
  .swap:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
  .swap:focus-visible{outline:3px solid var(--butter);outline-offset:3px;}
  .swap[hidden]{display:none;}
  .swap svg{width:15px;height:15px;display:block;}

  .controls{
    position:absolute;
    left:0;
    right:0;
    bottom:12px;
    z-index:4;
    display:flex;
    justify-content:center;
    gap:8px;
  }

  .btn{
    font-family:var(--display);
    font-weight:600;
    font-size:13px;
    color:var(--ink);
    background:var(--butter);
    border:3px solid var(--ink);
    border-radius:999px;
    padding:7px 16px 8px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
    transition:transform .08s ease,box-shadow .08s ease,background-color .15s ease;
  }
  .btn:hover{background:#FFE07A;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
  .btn:focus-visible{outline:3px solid var(--butter);outline-offset:3px;}
  .btn.secondary{background:var(--magenta);color:var(--cream);padding:7px 13px 8px;}
  .btn.secondary:hover{background:#FF7CB5;}

  .shout{
    position:absolute;
    left:50%;
    top:42%;
    z-index:5;
    font-family:var(--display);
    font-weight:700;
    font-size:46px;
    letter-spacing:-.02em;
    color:var(--butter);
    text-shadow:0 4px 0 #B8341A, 0 9px 18px rgba(0,0,0,.55);
    opacity:0;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(.2) rotate(-7deg);
    transition:opacity .4s ease;
  }
  .shout.is-up{animation:shout-pop .9s cubic-bezier(.2,1.7,.4,1) forwards, shout-wobble 1.5s .8s ease-in-out infinite;}
  @keyframes shout-pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-14deg);}
    55%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(4deg);}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg);}
  }
  @keyframes shout-wobble{
    0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-2deg);}
    50%{transform:translate(-50%,-50%) scale(1.05) rotate(2.5deg);}
  }

  .caption{
    margin:0;
    max-width:380px;
    font-family:var(--data);
    font-size:10px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:#6E5C8C;
    text-align:center;
    line-height:1.8;
    word-break:break-word;
  }
  .caption b{color:#A98FC9;font-weight:700;}

  @media (prefers-reduced-motion: reduce){
    .shout.is-up{animation:shout-pop .4s ease-out forwards;}
    .flash.is-on{animation:none;}
    .btn,.swap,.bg{transition:none;}
  }
</style>
</head>
<body>

<div class="timer" id="frame">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="scrim"></div>
  <canvas id="stage"></canvas>
  <div class="flash" id="flash"></div>
  <div class="shout" id="shout">TIME!</div>
  <div class="readout" id="readout" role="timer" aria-live="off">1:00</div>

  <button class="swap" id="swap" type="button" aria-label="Change background" title="Change background" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="3"></rect>
      <path d="M3 16l5-5 4 4 3-3 6 6"></path>
      <circle cx="9" cy="9" r="1.4"></circle>
    </svg>
  </button>

  <div class="controls">
    <button class="btn" id="go" type="button" title="Space">Start</button>
    <button class="btn secondary" id="reset" type="button" title="R">Reset</button>
  </div>
</div>

<p class="caption" id="caption">Space start &middot; R reset &middot; B background</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ==================================================================
 *  BLOB TIMER — 60 seconds. Your artwork, your backgrounds, your sound.
 *
 *    your-folder/
 *      blob-timer.html
 *      body/
 *        body_01.png        <- YOUR CREATURE. Transparent PNG.
 *        body_02.png        <- optional; a random one is picked each run
 *      sounds/
 *        boop_01.wav        <- plays once, only when the minute is up
 *        boop_02.wav  ...
 *      images/
 *        background_01.png  <- shuffled by the corner button
 *        background_02.png  ...
 *
 *  This version needs no local server — everything works on a double-click.
 *
 *  ABOUT THE BODY PNG:
 *    - transparent background, creature filling most of the frame
 *    - around 800px on its long side is plenty
 *    - any shape works; the aspect ratio is read from the file and kept
 *    - at zero it shatters into shards of your own artwork, so a solid
 *      silhouette breaks up more convincingly than thin wispy shapes
 * ================================================================== */

var CONFIG = {
  bodyPath:   'body/',
  bodyBase:   'body_',
  bodyExts:   ['png', 'webp', 'gif', 'jpg', 'jpeg'],
  bodyHeight: 2.7,       // how tall your creature stands, in world units

  imagePath:  'images/',
  imageBase:  'background_',
  imageExts:  ['png', 'jpg', 'jpeg', 'webp', 'gif'],

  soundPath:  'sounds/',
  soundBase:  'boop_',
  soundExts:  ['mp4', 'mp3', 'm4a', 'wav', 'ogg', 'webm'],

  maxIndex:   40,
  missStreak: 3
};

var DURATION = 60;
var REDUCED  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var TAU      = Math.PI * 2;
var GROUND_Y = -1.40;
var PIECES   = REDUCED ? 12 : 26;
var GRID     = 14;      // how finely the artwork is diced before clustering

/* ==================================================================
 *  Finding your files
 * ================================================================== */

function pad(n){ return n < 10 ? '0' + n : '' + n; }

function candidates(path, base, i, exts){
  var out = [];
  [pad(i), String(i)].forEach(function(num){
    exts.forEach(function(ext){ out.push(path + base + num + '.' + ext); });
  });
  return out;
}

function probeImage(url){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload  = function(){ resolve(url); };
    img.onerror = function(){ resolve(null); };
    img.src = url;
  });
}

function probeSound(url){
  return new Promise(function(resolve){
    var el = new Audio();
    var settled = false;
    function hit(){ if (!settled){ settled = true; resolve(url); } }
    function miss(){ if (!settled){ settled = true; resolve(null); } }
    el.addEventListener('loadedmetadata', hit);
    el.addEventListener('canplaythrough', hit);
    el.addEventListener('error', miss);
    setTimeout(miss, 3000);
    el.preload = 'auto';
    el.src = url;
    el.load();
  });
}

/* All spellings of one number are checked at once — one at a time made an
   empty folder take painfully long to give up on. */
function discover(path, base, exts, probe){
  var found = [], misses = 0;
  function step(i){
    if (i > CONFIG.maxIndex || misses >= CONFIG.missStreak) return Promise.resolve(found);
    return Promise.all(candidates(path, base, i, exts).map(probe)).then(function(results){
      var hit = null;
      for (var k = 0; k < results.length; k++){ if (results[k]){ hit = results[k]; break; } }
      if (hit){ found.push(hit); misses = 0; } else { misses++; }
      return step(i + 1);
    });
  }
  return step(1);
}

/* ==================================================================
 *  Backgrounds
 * ================================================================== */

var frame    = document.getElementById('frame');
var bgLayers = [document.getElementById('bgA'), document.getElementById('bgB')];
var swapBtn  = document.getElementById('swap');
var caption  = document.getElementById('caption');

var bgUrls = [], bgIndex = -1, bgFront = 0;

function showBackground(url){
  var next = bgLayers[1 - bgFront];
  next.style.backgroundImage = 'url("' + encodeURI(url) + '")';
  next.style.opacity = '1';
  bgLayers[bgFront].style.opacity = '0';
  bgFront = 1 - bgFront;
}

function shuffleBackground(){
  if (!bgUrls.length) return;
  var i = 0;
  if (bgUrls.length > 1){
    do { i = Math.floor(Math.random() * bgUrls.length); } while (i === bgIndex);
  }
  bgIndex = i;
  showBackground(bgUrls[i]);
}

swapBtn.addEventListener('click', shuffleBackground);

/* ==================================================================
 *  Sound — one clip, only when the minute is up
 * ================================================================== */

var soundPool = [], soundIndex = -1, soundsPrimed = false;

/* Browsers only allow audio after a gesture, so the first Start silently arms
   every clip. This is the only time a clip is touched before the end, so it is
   belt-and-braces silent: muted AND zero volume, restored once it is stopped. */
function primeSounds(){
  if (soundsPrimed || !soundPool.length) return;
  soundsPrimed = true;
  soundPool.forEach(function(el){
    el.muted = true;
    el.volume = 0;
    function silence(){
      el.pause();
      el.currentTime = 0;
      el.muted = false;
      el.volume = 1;
    }
    try {
      var p = el.play();
      if (p && p.then) p.then(silence).catch(silence);
      else silence();
    } catch (err){ silence(); }
  });
}

function stopSounds(){
  soundPool.forEach(function(el){
    try { el.pause(); el.currentTime = 0; } catch (err){ /* ignore */ }
  });
}

function playEndSound(){
  if (soundPool.length){
    var i = 0;
    if (soundPool.length > 1){
      do { i = Math.floor(Math.random() * soundPool.length); } while (i === soundIndex);
    }
    soundIndex = i;
    var el = soundPool[i];
    try {
      el.currentTime = 0;
      var p = el.play();
      if (p && p.catch) p.catch(function(){ fallbackBoom(); });
      return;
    } catch (err){ /* fall through */ }
  }
  fallbackBoom();
}

/* Stand-in so the timer still lands before you add any files. */
var actx = null;
function fallbackBoom(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    var t = actx.currentTime + 0.01;

    var len = Math.floor(actx.sampleRate * 0.5);
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var data = buf.getChannelData(0);
    for (var n = 0; n < len; n++) data[n] = (Math.random() * 2 - 1) * Math.pow(1 - n / len, 2.5);
    var noise = actx.createBufferSource(); noise.buffer = buf;
    var nf = actx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 1400;
    var ng = actx.createGain(); ng.gain.value = 0.35;
    noise.connect(nf).connect(ng).connect(actx.destination);
    noise.start(t);

    var osc = actx.createOscillator(), og = actx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(34, t + 0.55);
    og.gain.setValueAtTime(0.0001, t);
    og.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    osc.connect(og).connect(actx.destination);
    osc.start(t); osc.stop(t + 0.65);
  } catch (err){ /* silence is survivable */ }
}

/* ==================================================================
 *  Scene
 * ================================================================== */

var canvas = document.getElementById('stage');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
var camHome = new THREE.Vector3(0, 0.85, 7.0);
var LOOK_Y = -0.05;
camera.position.copy(camHome);

function resize(){
  var r = frame.getBoundingClientRect();
  var w = Math.max(1, Math.round(r.width));
  var h = Math.max(1, Math.round(r.height));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camHome.z = camera.aspect < 1 ? 7.0 / camera.aspect : 7.0;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);

/* The artwork is drawn unlit so your PNG appears exactly as you painted it.
   Lights are here only for the progress ring. */
scene.add(new THREE.HemisphereLight(0xE9FFD9, 0x1B2A18, 0.9));
var key = new THREE.DirectionalLight(0xFFF6E8, 0.9);
key.position.set(3.2, 5.4, 4.2);
scene.add(key);

/* --- painted contact shadow, so the creature sits on the ground --- */
var shadowTex = (function(){
  var c = document.createElement('canvas');
  c.width = c.height = 128;
  var g = c.getContext('2d');
  var grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0,    'rgba(0,0,0,0.55)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

var contactShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = GROUND_Y + 0.012;
scene.add(contactShadow);

/* --- progress ring --- */
var RING_R = 1.35;
/* The ring starts green and heats toward orange as the minute runs out.
   Set RING_HOT to the same green as RING_CALM to keep it green throughout. */
var RING_CALM = new THREE.Color('#4CE07A');
var RING_HOT  = new THREE.Color('#FF5A2B');

var ringMat = new THREE.MeshStandardMaterial({ color: RING_CALM.clone(), roughness: 0.35, metalness: 0.05 });
var ring = new THREE.Mesh(new THREE.TorusGeometry(RING_R, 0.085, 8, 96, TAU), ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = GROUND_Y + 0.03;
scene.add(ring);

var ringTrack = new THREE.Mesh(
  new THREE.TorusGeometry(RING_R, 0.05, 8, 96, TAU),
  new THREE.MeshStandardMaterial({ color: 0x1C1230, roughness: 1, transparent: true, opacity: 0.55 })
);
ringTrack.rotation.x = -Math.PI / 2;
ringTrack.position.y = GROUND_Y + 0.01;
scene.add(ringTrack);

var lastArc = -1;
function setRing(fraction){
  var arc = Math.max(0.0001, Math.min(1, fraction)) * TAU;
  if (Math.abs(arc - lastArc) < 0.01) return;
  lastArc = arc;
  ring.geometry.dispose();
  ring.geometry = new THREE.TorusGeometry(RING_R, 0.085, 8, 96, arc);
}

/* ==================================================================
 *  The creature: your PNG on a plane
 *
 *    blob -> squash -> creature -> plane
 *
 *  `squash` carries the breathing. The plane is diced into a grid so that
 *  at zero it can be clustered into shards of the artwork itself.
 * ================================================================== */

var blob = new THREE.Group();
scene.add(blob);

var squash = new THREE.Group();
blob.add(squash);

var creature = new THREE.Group();
squash.add(creature);

var bodyMat = new THREE.MeshBasicMaterial({
  transparent: true,
  alphaTest: 0.28,          // keeps the cut-out edge crisp when shards overlap
  side: THREE.DoubleSide,   // shards spin, so both faces must draw
  depthWrite: true
});

var bodyMesh = null;
var bodyWidth = 2, bodyHeight = 2;

function setBodyTexture(tex){
  var img = tex.image;
  var aspect = (img && img.width && img.height) ? (img.width / img.height) : 1;

  tex.minFilter = THREE.LinearFilter;    // no mipmaps: keeps the art crisp
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  bodyMat.map = tex;
  bodyMat.needsUpdate = true;

  bodyHeight = CONFIG.bodyHeight;
  bodyWidth  = bodyHeight * aspect;

  if (bodyMesh){
    creature.remove(bodyMesh);
    bodyMesh.geometry.dispose();
  }
  bodyMesh = new THREE.Mesh(new THREE.PlaneGeometry(bodyWidth, bodyHeight, GRID, GRID), bodyMat);
  bodyMesh.position.y = GROUND_Y + bodyHeight / 2;
  creature.add(bodyMesh);

  contactShadow.scale.set(bodyWidth * 0.78, bodyWidth * 0.34, 1);

  buildPieces(creature, PIECES);
}

/* A green hairy lump drawn in code, so the timer works before you add art. */
function fallbackTexture(){
  var S = 512;
  var c = document.createElement('canvas');
  c.width = c.height = S;
  var g = c.getContext('2d');
  var cx = S / 2, cy = S / 2 + 10, rx = S * 0.31, ry = S * 0.34;

  // hair first, so it sits behind the body
  g.strokeStyle = '#2C7A42';
  g.lineCap = 'round';
  for (var i = 0; i < 200; i++){
    var a = (i / 200) * TAU + Math.random() * 0.05;
    var len = 26 + Math.random() * 46;
    var x0 = cx + Math.cos(a) * rx * 0.94;
    var y0 = cy + Math.sin(a) * ry * 0.94;
    g.strokeStyle = i % 3 ? '#2C7A42' : '#7ED95E';
    g.lineWidth = 3 + Math.random() * 4;
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(cx + Math.cos(a) * (rx + len), cy + Math.sin(a) * (ry + len));
    g.stroke();
  }

  var grad = g.createRadialGradient(cx - rx * 0.3, cy - ry * 0.4, rx * 0.1, cx, cy, rx * 1.15);
  grad.addColorStop(0, '#7ED95E');
  grad.addColorStop(0.6, '#45B364');
  grad.addColorStop(1, '#2C7A42');
  g.fillStyle = grad;
  g.beginPath();
  for (var t = 0; t <= 64; t++){
    var ang = (t / 64) * TAU;
    var wob = 1 + 0.05 * Math.sin(ang * 3.2) + 0.035 * Math.sin(ang * 5.1 + 1.3);
    var x = cx + Math.cos(ang) * rx * wob;
    var y = cy + Math.sin(ang) * ry * wob;
    if (t === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.fill();

  return new THREE.CanvasTexture(c);
}

/* ==================================================================
 *  Explosion — the artwork shatters into shards of itself
 * ================================================================== */

var pieces = [];

/* Cluster the plane's triangles by proximity. Each cluster keeps its slice of
   the UV map, so every shard shows the correct part of your picture. */
function buildPieces(root, targetCount){
  pieces.forEach(function(p){
    scene.remove(p.mesh);
    p.mesh.geometry.dispose();
  });
  pieces = [];

  root.updateMatrixWorld(true);
  var invRoot = new THREE.Matrix4().copy(root.matrixWorld).invert();

  var meshes = [];
  root.traverse(function(o){
    if (o.isInstancedMesh) return;
    if (o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o);
  });
  if (!meshes.length) return;

  var totalTris = 0;
  meshes.forEach(function(m){
    var g = m.geometry;
    totalTris += Math.floor((g.index ? g.index.count : g.attributes.position.count) / 3);
  });
  if (!totalTris) return;

  var a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();

  meshes.forEach(function(m){
    var g = m.geometry;
    var pos = g.attributes.position;
    var uvA = g.attributes.uv;
    var index = g.index;
    var triCount = Math.floor((index ? index.count : pos.count) / 3);
    if (!triCount) return;

    var buckets = Math.max(1, Math.round(targetCount * triCount / totalTris));
    var xf = new THREE.Matrix4().multiplyMatrices(invRoot, m.matrixWorld);

    var verts = new Float32Array(triCount * 9);
    var uvs   = uvA ? new Float32Array(triCount * 6) : null;
    var cents = new Float32Array(triCount * 3);
    var t, s, k;

    for (t = 0; t < triCount; t++){
      var i0 = index ? index.getX(t * 3)     : t * 3;
      var i1 = index ? index.getX(t * 3 + 1) : t * 3 + 1;
      var i2 = index ? index.getX(t * 3 + 2) : t * 3 + 2;

      a.fromBufferAttribute(pos, i0).applyMatrix4(xf);
      b.fromBufferAttribute(pos, i1).applyMatrix4(xf);
      c.fromBufferAttribute(pos, i2).applyMatrix4(xf);

      var o9 = t * 9;
      verts[o9]     = a.x; verts[o9 + 1] = a.y; verts[o9 + 2] = a.z;
      verts[o9 + 3] = b.x; verts[o9 + 4] = b.y; verts[o9 + 5] = b.z;
      verts[o9 + 6] = c.x; verts[o9 + 7] = c.y; verts[o9 + 8] = c.z;

      cents[t * 3]     = (a.x + b.x + c.x) / 3;
      cents[t * 3 + 1] = (a.y + b.y + c.y) / 3;
      cents[t * 3 + 2] = (a.z + b.z + c.z) / 3;

      if (uvs){
        var o6 = t * 6;
        uvs[o6]     = uvA.getX(i0); uvs[o6 + 1] = uvA.getY(i0);
        uvs[o6 + 2] = uvA.getX(i1); uvs[o6 + 3] = uvA.getY(i1);
        uvs[o6 + 4] = uvA.getX(i2); uvs[o6 + 5] = uvA.getY(i2);
      }
    }

    var seeds = [];
    for (s = 0; s < buckets; s++){
      var pick = Math.floor(Math.random() * triCount) * 3;
      seeds.push([cents[pick], cents[pick + 1], cents[pick + 2]]);
    }

    var groups = [];
    for (s = 0; s < buckets; s++) groups.push({ pos: [], uv: [] });

    for (t = 0; t < triCount; t++){
      var cx = cents[t * 3], cy = cents[t * 3 + 1], cz = cents[t * 3 + 2];
      var best = 0, bestD = Infinity;
      for (s = 0; s < buckets; s++){
        var dx = cx - seeds[s][0], dy = cy - seeds[s][1], dz = cz - seeds[s][2];
        var d = dx * dx + dy * dy + dz * dz;
        if (d < bestD){ bestD = d; best = s; }
      }
      var G = groups[best];
      for (k = 0; k < 9; k++) G.pos.push(verts[t * 9 + k]);
      if (uvs) for (k = 0; k < 6; k++) G.uv.push(uvs[t * 6 + k]);
    }

    var material = Array.isArray(m.material) ? m.material[0] : m.material;

    groups.forEach(function(G){
      if (!G.pos.length) return;
      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(G.pos, 3));
      if (G.uv.length) geo.setAttribute('uv', new THREE.Float32BufferAttribute(G.uv, 2));
      geo.computeVertexNormals();
      geo.computeBoundingSphere();

      var home = geo.boundingSphere ? geo.boundingSphere.center.clone() : new THREE.Vector3();

      /* Recentre so each shard spins about its own middle. UVs are per-vertex
         and ride along untouched, so the texture stays pinned to the art. */
      geo.translate(-home.x, -home.y, -home.z);

      var pm = new THREE.Mesh(geo, material);
      pm.visible = false;
      pm.frustumCulled = false;
      scene.add(pm);

      pieces.push({
        mesh: pm,
        home: home,
        radius: geo.boundingSphere ? geo.boundingSphere.radius : 0.2,
        vel: new THREE.Vector3(),
        spin: new THREE.Vector3()
      });
    });
  });
}

function randomDirection(v){
  var z = Math.random() * 2 - 1;
  var ang = Math.random() * TAU;
  var r = Math.sqrt(Math.max(0, 1 - z * z));
  return v.set(Math.cos(ang) * r, z, Math.sin(ang) * r);
}

var scratch = new THREE.Vector3();

function blowUp(){
  creature.visible = false;
  contactShadow.visible = false;

  pieces.forEach(function(p){
    p.mesh.visible = true;
    p.mesh.position.copy(p.home);
    p.mesh.rotation.set(0, 0, 0);

    scratch.copy(p.home);
    scratch.z = 0;
    if (scratch.lengthSq() < 1e-6) randomDirection(scratch); else scratch.normalize();
    /* flat art, so give the shards some depth on the way out */
    scratch.z = (Math.random() - 0.35) * 0.9;

    p.vel.copy(scratch).multiplyScalar(1.9 + Math.random() * 2.3);
    p.vel.y += 1.6;
    p.spin.set((Math.random() - 0.5) * 13, (Math.random() - 0.5) * 13, (Math.random() - 0.5) * 13);
  });
}

function hidePieces(){
  pieces.forEach(function(p){ p.mesh.visible = false; });
}

function stepPieces(dt, pull){
  for (var i = 0; i < pieces.length; i++){
    var p = pieces[i];
    if (!p.mesh.visible) continue;

    if (pull > 0){
      /* it pulls itself back together */
      var k = Math.min(1, pull * dt * 6);
      p.mesh.position.lerp(p.home, k);
      p.mesh.rotation.x *= (1 - k);
      p.mesh.rotation.y *= (1 - k);
      p.mesh.rotation.z *= (1 - k);
      continue;
    }

    p.vel.y -= 11 * dt;
    p.vel.multiplyScalar(1 - 0.5 * dt);
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.rotation.x += p.spin.x * dt;
    p.mesh.rotation.y += p.spin.y * dt;
    p.mesh.rotation.z += p.spin.z * dt;

    var floor = GROUND_Y + p.radius * 0.4;
    if (p.mesh.position.y < floor){
      p.mesh.position.y = floor;
      p.vel.y *= -0.34;
      p.vel.x *= 0.7; p.vel.z *= 0.7;
      p.spin.multiplyScalar(0.55);
      if (Math.abs(p.vel.y) < 0.4) p.vel.y = 0;
    }
  }
}

/* ==================================================================
 *  Timer state
 * ================================================================== */

var STATE = { IDLE: 0, RUN: 1, PAUSE: 2, BOOM: 3 };
var IMPLODE = 3.8, REFORM = 4.6, DONE = 7.0;

var state = STATE.IDLE;
var remaining = DURATION;
var boomT = 0;
var shake = 0;
var lastWhole = DURATION;

var bodyTextures = [], bodyIndex = -1;

var readout  = document.getElementById('readout');
var goBtn    = document.getElementById('go');
var resetBtn = document.getElementById('reset');
var shout    = document.getElementById('shout');
var flash    = document.getElementById('flash');

function fmt(s){
  s = Math.max(0, Math.ceil(s - 0.0001));
  var m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

function paintReadout(){
  readout.textContent = state === STATE.BOOM ? '0:00' : fmt(remaining);
  readout.classList.toggle('is-urgent', state === STATE.RUN && remaining <= 10);
  readout.classList.toggle('is-done', state === STATE.BOOM);
}

function setButton(){
  goBtn.textContent =
    state === STATE.RUN   ? 'Pause'  :
    state === STATE.PAUSE ? 'Resume' :
    state === STATE.BOOM  ? 'Again'  : 'Start';
}

/* With more than one body PNG, each fresh run gets a different creature. */
function pickBody(){
  if (bodyTextures.length < 2) return;
  var i;
  do { i = Math.floor(Math.random() * bodyTextures.length); } while (i === bodyIndex);
  bodyIndex = i;
  setBodyTexture(bodyTextures[i]);
}

function start(){
  primeSounds();
  if (state === STATE.BOOM) reset();
  state = STATE.RUN;
  lastWhole = Math.ceil(remaining);
  shout.classList.remove('is-up');
  setButton(); paintReadout();
}

function pause(){ state = STATE.PAUSE; setButton(); }

function reset(){
  state = STATE.IDLE;
  stopSounds();
  remaining = DURATION;
  boomT = 0;
  shake = 0;
  lastWhole = DURATION;
  blob.position.set(0, 0, 0);
  blob.rotation.set(0, 0, 0);
  squash.scale.set(1, 1, 1);
  pickBody();
  creature.visible = true;
  contactShadow.visible = true;
  hidePieces();
  shout.classList.remove('is-up');
  flash.classList.remove('is-on');
  setRing(1);
  setButton(); paintReadout();
}

function toggle(){ if (state === STATE.RUN) pause(); else start(); }

goBtn.addEventListener('click', toggle);
resetBtn.addEventListener('click', function(){ primeSounds(); reset(); });

window.addEventListener('keydown', function(e){
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === 'Space'){
    if (e.target && e.target.tagName === 'BUTTON') return;   // the button handles its own space
    e.preventDefault();
    toggle();
  }
  else if (e.key === 'r' || e.key === 'R'){ reset(); }
  else if (e.key === 'b' || e.key === 'B'){ shuffleBackground(); }
});

/* ==================================================================
 *  Loop
 * ================================================================== */

var clock = new THREE.Clock();

function advance(dt){
  if (state === STATE.RUN){
    remaining -= dt;
    var whole = Math.ceil(remaining);
    if (whole < lastWhole && whole >= 0){
      lastWhole = whole;
      paintReadout();
    }
    if (remaining <= 0){
      remaining = 0;
      state = STATE.BOOM;
      boomT = 0;
      shake = REDUCED ? 0 : 0.26;
      playEndSound();
      blowUp();
      shout.classList.add('is-up');
      flash.classList.remove('is-on');
      void flash.offsetWidth;
      flash.classList.add('is-on');
      setButton(); paintReadout();
    }
  } else if (state === STATE.BOOM){
    boomT += dt;
    if (boomT > REFORM - 0.2) shout.classList.remove('is-up');
    if (boomT > DONE){
      state = STATE.IDLE;
      remaining = DURATION;
      lastWhole = DURATION;
      setButton(); paintReadout();
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.05);
  var now = clock.elapsedTime;

  advance(dt);

  var frac = remaining / DURATION;
  var tension = state === STATE.RUN ? Math.pow(1 - frac, 2.2) : 0;

  setRing(state === STATE.BOOM ? 0.0001 : frac);
  ringMat.color.copy(RING_CALM).lerp(RING_HOT, tension);

  var sx = 1, sy = 1, sz = 1, py = 0, rz = 0;

  if (state === STATE.BOOM){
    var t = boomT;
    stepPieces(dt, t > IMPLODE ? (t - IMPLODE) / (REFORM - IMPLODE) : 0);

    if (t < REFORM){
      creature.visible = false;
      contactShadow.visible = false;
    } else {
      var u = t - REFORM;
      var grow = 1 - Math.exp(-u * 9);
      var wob = Math.sin(u * 13) * 0.34 * Math.exp(-u * 3.2);
      sy = Math.max(0.01, grow + wob);
      sx = sz = Math.max(0.01, grow - wob * 0.6);
      creature.visible = true;
      contactShadow.visible = true;
      if (u > 0.12 && pieces.length && pieces[0].mesh.visible) hidePieces();
    }
  } else if (state === STATE.RUN){
    var speed = 1.8 + tension * 7.5;
    var breathe = Math.sin(now * speed);
    sy = 1 + breathe * (0.05 + tension * 0.1);
    sx = sz = 1 - breathe * (0.035 + tension * 0.08);
    py = Math.abs(Math.sin(now * speed * 0.5)) * (0.03 + tension * 0.16);
    rz = Math.sin(now * speed * 0.7) * tension * 0.1;
    blob.position.x = (tension > 0.72 && !REDUCED) ? (Math.random() - 0.5) * (tension - 0.72) * 0.5 : 0;
  } else {
    var b2 = Math.sin(now * 1.7);
    sy = 1 + b2 * 0.045;
    sx = sz = 1 - b2 * 0.03;
    py = Math.abs(Math.sin(now * 0.85)) * 0.04;
    blob.position.x = 0;
  }

  squash.scale.set(sx, sy, sz);
  blob.position.y = py;
  blob.rotation.z = rz;

  /* the shadow shrinks and softens as the creature lifts off the ground */
  if (contactShadow.visible){
    var lift = 1 - Math.min(0.55, py * 1.6);
    contactShadow.scale.set(bodyWidth * 0.78 * lift * sx, bodyWidth * 0.34 * lift, 1);
    contactShadow.material.opacity = 0.55 + 0.45 * lift;
    contactShadow.position.x = blob.position.x;
  }

  shake = Math.max(0, shake - dt * 0.9);
  camera.position.set(
    camHome.x + (Math.random() - 0.5) * shake,
    camHome.y + (Math.random() - 0.5) * shake,
    camHome.z
  );
  camera.lookAt(0, LOOK_Y, 0);

  renderer.render(scene, camera);
}

/* ==================================================================
 *  Go
 * ================================================================== */

resize();
setBodyTexture(fallbackTexture());
reset();
animate();

var bodyNote = 'built-in blob';

/* The on-screen caption stays as the keyboard shortcuts only. The tally of
   what was actually found goes to the browser console instead — still there
   when a folder name is wrong, just not on display. */
function describeAssets(){
  caption.innerHTML = 'Space start &middot; R reset &middot; B background';
  console.log(
    'blob-timer — bodies: ' + (bodyTextures.length || bodyNote) +
    ', backgrounds: ' + bgUrls.length +
    ', sounds: ' + soundPool.length
  );
}

function loadTexture(url){
  return new Promise(function(resolve){
    new THREE.TextureLoader().load(url, resolve, undefined, function(){ resolve(null); });
  });
}

Promise.all([
  discover(CONFIG.bodyPath,  CONFIG.bodyBase,  CONFIG.bodyExts,  probeImage),
  discover(CONFIG.imagePath, CONFIG.imageBase, CONFIG.imageExts, probeImage),
  discover(CONFIG.soundPath, CONFIG.soundBase, CONFIG.soundExts, probeSound)
]).then(function(results){
  var bodyUrls = results[0];
  bgUrls = results[1];

  soundPool = results[2].map(function(url){
    var el = new Audio(url);
    el.preload = 'auto';
    return el;
  });

  if (bgUrls.length){
    swapBtn.hidden = false;
    shuffleBackground();
  }

  return Promise.all(bodyUrls.map(loadTexture)).then(function(texes){
    bodyTextures = texes.filter(Boolean);
    if (bodyTextures.length){
      bodyIndex = Math.floor(Math.random() * bodyTextures.length);
      setBodyTexture(bodyTextures[bodyIndex]);
    }
    describeAssets();
  });
});

})();
</script>
</body>
</html>
