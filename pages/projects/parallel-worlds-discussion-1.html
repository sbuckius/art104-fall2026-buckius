<style>
:root{
  --paper:#0f1b12; --ink:#f2edf0; --soft:#a6b4a6;
  --plum:#271021; --purple:#c77bb2; --purpledeep:#6d2d5d;
  --mauve:#d194b1; --pink:#d7689d;
  --olive:#92a64a; --olivelt:#b9cc72;
  --teal:#5fa3a3; --tealdk:#6fb0b0;
  --rule:rgba(242,237,240,.22); --panel:rgba(255,255,255,.055);
  --stripe:repeating-linear-gradient(90deg,
    var(--teal) 0 13px, var(--olive) 13px 26px, var(--olivelt) 26px 39px,
    var(--pink) 39px 52px, var(--mauve) 52px 65px, var(--purpledeep) 65px 78px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Newsreader",Georgia,serif;font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.1rem 5rem}
h1,h2,h3,h4,.lbl,.kicker,button,select,input,textarea,th,.chip,.tag{
  font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin:0}
h1 .yr{color:var(--olivelt)}
h2{font-size:clamp(1.3rem,3.2vw,1.9rem);font-weight:800;letter-spacing:-.018em;
  margin:0 0 .5rem;padding-bottom:.3rem;border-bottom:3px solid var(--olivelt)}
h3{font-size:1rem;font-weight:800;color:var(--mauve);margin:1.5rem 0 .4rem}
h4{font-size:.76rem;font-weight:700;letter-spacing:.05em;color:var(--pink);margin:0 0 .4rem}
p{margin:0 0 .8rem}
a{color:var(--teal)}
header.top{padding:1.3rem 0 .6rem;border-bottom:6px solid transparent;border-image:var(--stripe) 6}
.titlerow{display:flex;gap:1rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.7rem}
.sub{font-style:italic;color:var(--soft);font-size:.95rem}
.idbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.6rem 0 .5rem}
.idbar input,.idbar select{width:auto}
.status{font-family:"Bricolage Grotesque",sans-serif;font-size:.74rem;font-weight:700;
  letter-spacing:.03em;color:var(--soft)}
.status.ok{color:var(--tealdk)}
.here{margin-left:auto;display:flex;gap:.3rem;flex-wrap:wrap}
.chip{font-size:.7rem;font-weight:700;padding:.18rem .45rem;border:2px solid var(--mauve);
  color:var(--mauve);background:rgba(209,148,177,.14)}
.chip.muted{border-color:var(--rule);color:var(--soft);background:none}
.stepnav{display:flex;gap:.3rem;flex-wrap:wrap;padding:.3rem 0 .6rem}
.stepnav button{min-width:2.3rem;font-size:.78rem;font-weight:700;padding:.3rem .5rem;
  background:none;border:2px solid var(--rule);color:var(--ink);cursor:pointer}

.stepnav button.done{border-color:var(--olivelt);color:var(--olivelt);background:rgba(146,166,74,.26)}
.stepnav button[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.stepnav button[aria-current="true"].done{background:var(--olivelt);border-color:var(--olivelt);color:var(--paper)}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);color:var(--ink);
  border:2px solid var(--rule);padding:.45rem .55rem;font-size:.95rem;
  font-family:"Newsreader",Georgia,serif;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(95,163,163,.25)}
textarea{resize:vertical;line-height:1.45}
textarea[readonly]{opacity:.75;border-style:dashed}
button{font-size:.82rem;font-weight:700;padding:.4rem .8rem;background:none;
  border:2px solid var(--ink);color:var(--ink);cursor:pointer}
button.primary{background:var(--teal);border-color:var(--teal);color:var(--paper)}
button.ghost{border-color:var(--rule);color:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
.f{margin:.9rem 0}
.f .lbl{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;
  color:var(--tealdk);margin-bottom:.15rem}
.f .hint{display:block;font-size:.85rem;color:var(--soft);font-style:italic;margin-bottom:.3rem}
.note{font-size:.9rem;color:var(--soft)}
.q{margin:1.1rem 0;padding:.8rem 1rem;background:var(--panel);border-left:6px solid var(--olivelt)}
.q:nth-of-type(6n+2){border-left-color:var(--mauve)}
.q:nth-of-type(6n+3){border-left-color:var(--teal)}
.q:nth-of-type(6n+4){border-left-color:var(--purple)}

.q h4{color:var(--ink);font-size:.95rem;font-weight:800;letter-spacing:0;margin-bottom:.5rem}
.band{margin:1.1rem 0;padding:.8rem 1rem;background:var(--pink);color:#0f1b12;font-size:.95rem}
.band b{font-weight:800}
.silence{margin:1.1rem 0;padding:.8rem 1rem;background:rgba(199,123,178,.16);
  border-left:6px solid var(--purple);font-size:.95rem}
.timer{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.6rem 0 1rem;
  padding:.5rem .8rem;background:var(--panel);border-left:6px solid var(--olivelt)}
.timer .clock{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;font-weight:800;
  min-width:4.5rem;color:var(--tealdk)}
.timer .clock.low{color:var(--pink)}
.cards{display:grid;gap:.5rem;margin:.6rem 0}
@media(min-width:44rem){.cards{grid-template-columns:1fr 1fr}}
.card{padding:.5rem .7rem;background:var(--panel);border-left:4px solid var(--olivelt)}
.card:nth-child(5n+2){border-left-color:var(--mauve)}
.card:nth-child(5n+3){border-left-color:var(--teal)}
.card:nth-child(5n+4){border-left-color:var(--purple)}
.card:nth-child(5n){border-left-color:var(--pink)}
.card .who{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:.66rem;
  font-weight:700;letter-spacing:.04em;color:var(--soft)}
.card .tx{white-space:pre-wrap}
.empty{color:var(--soft);font-style:italic;font-size:.9rem}
body.lens-mine .card.other,
body.lens-mine .shot.other,
body.lens-mine .q.othergroup,
body.lens-mine table.grid tr.other{display:none}
body.lens-mine .lensnote{display:block}
.lensnote{display:none;margin:.6rem 0;padding:.5rem .8rem;background:var(--panel);
  border-left:6px solid var(--mauve);font-size:.88rem;color:var(--soft)}
.shots{display:grid;gap:.5rem;grid-template-columns:repeat(2,1fr);margin:.6rem 0}
@media(min-width:44rem){.shots{grid-template-columns:repeat(4,1fr)}}
.shot{background:rgba(255,255,255,.05);border:2px solid var(--rule);padding:.3rem}
.shot img{width:100%;display:block;cursor:zoom-in}
.shot.big{grid-column:1 / -1}
.shot.big img{max-height:75vh;width:auto;margin:0 auto}
.shot span{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:.62rem;
  font-weight:700;color:var(--soft);margin-top:.15rem}
.foot{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:2rem;
  padding-top:1rem;border-top:6px solid transparent;border-image:var(--stripe) 6}
.foot .spacer{flex:1}
.warn{padding:.9rem 1rem;background:rgba(146,166,74,.14);border-left:6px solid var(--olivelt);
  font-size:.92rem;margin:1rem 0}
@media print{
  .stepnav,.foot,.idbar,.here,.timer,button{display:none!important}
  body{background:#fff;color:#000}
  .stepbreak{break-before:page;page-break-before:always}
  textarea,input{border:1px solid #999!important;background:#fff!important;color:#000!important}
}
</style>

<body>
<div class="wrap">

<header class="top">
  <div class="titlerow">
    <h1>Parallel Worlds Zine, <span class="yr">2999</span></h1>
    <span class="sub">the discussion</span>
  </div>
  <div class="idbar">
    <input type="text" id="name" placeholder="your name" autocomplete="name" style="max-width:11rem">
    <select id="group"></select>
    <select id="reading"></select>
    <select id="lens">
      <option value="group">everything the class posted</option>
      <option value="mine">only what I wrote</option>
    </select>
    <span class="status" id="status">connecting…</span>
    <span class="here" id="here"></span>
  </div>
  <nav class="stepnav" id="nav"></nav>
</header>

<main id="step"></main>

<div class="foot">
  <button id="prev">← Back</button>
  <button id="mark" class="ghost">Mark this step done</button>
  <button id="pdf" class="ghost">Export this page as PDF</button>
  <button id="pdfall" class="ghost">Export every page</button>
  <span class="spacer"></span>
  <span class="status" id="prog"></span>
  <button id="next" class="primary">Next →</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===================================================================
   SETTINGS

   TALK_ROOM   where this session's answers are stored. Give each
               class section its own.
   LIVE_ROOM   the walkthrough's class board, so this tool can read the
               draft page images your groups uploaded. It must match
               the ROOM setting in parallel-worlds-zine1-2999.html.
   STAGE       which draft to show: draft, d2, d3, d4 or fin.
   GROUPS      a number, or your own labels, e.g. ["Kitchen","Harbor"]
   =================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyCZFDU-WlSmHqjXTs1Ox0nf9xeJU_xbaX0",
  authDomain:        "collaborativemashup.firebaseapp.com",
  projectId:         "collaborativemashup",
  storageBucket:     "collaborativemashup.firebasestorage.app",
  messagingSenderId: "562437984610",
  appId:             "1:562437984610:web:9f3711c26e097bc8ef9c3b"
};
const TALK_ROOM = "art104-fall-talk";
const LIVE_ROOM = "art104-fall-live";
const STAGE     = "d3";
const GROUPS    = ["1", "2", "3", "4", "Test"];

const PAGES = ["Cover", "Manifesto", "Company history", "Product / service 1",
               "Product / service 2", "Product / service 3", "Back cover"];

const ROLES = [
  ["art", "Art director", [
    "What images are the strongest?",
    "What images need to be improved?",
    "Do any images look like they don't fit this world and organization? Which ones?",
    "What is the next image to make, and who is making it?"]],
  ["design", "Design director", [
    "Does the visual layout and structure work? Are there pages where it fails?",
    "Where does the eye go first on each spread, and is that where it should go?",
    "Which page has too much on it?",
    "What one change to the template would improve every page at once?"]],
  ["editor", "Text editor", [
    "Which sentence is doing the most work, and is it on the right page?",
    "Where does the voice slip out of the organization and into the writer's?",
    "What is explained that could be shown instead?",
    "What needs cutting rather than fixing?"]],
  ["world", "World keeper", [
    "Does anything contradict a law or the manifesto?",
    "Which part of the world is mentioned but never shown?",
    "Is the divergence legible to a reader who did not build this?"]],
  ["through", "Throughline", [
    "Which page could be removed without anyone noticing?",
    "Does the order make sense or should it be changed?",
    "What is the one thing this zine argues, and which page says it?"]],
  ["pm", "Project manager", [
    "What is blocking the next step, and whose is it?",
    "What has been agreed but not done?",
    "Who needs support to get the work done? Who needs more communication?"]]
];

const COLD = [
  ["c1", "Now you have heard them present, what is the most interesting thing about this zine?"],
  ["c2", "What is working well that they should keep doing?"],
  ["c3", "What is engaging, provocative, enlightening or thought-provoking about it?"],
  ["c4", "Which page is working the best in terms of the formal and aesthetic elements?"],
  ["c5", "Which page needs the most work in terms of formal and aesthetic elements?"],
  ["c6", "Which page is working the best in terms of the concepts conveyed?"],
  ["c7", "Which page needs the most work in terms of expressing the concept?"],
  ["c8", "What did they say they were trying to do that is not showing up on the page yet?"],
  ["c9", "What is one idea they have not thought of that would make this stronger?"],
  ["c10", "What is one suggestion for the group to act on before the next draft?"]
];

const STEPS = [
  { id: "prep", tag: "1", title: "Prepare, in your group", mins: 15, kind: "prep",
    blurb: ["Start with your own group. Fifteen minutes to decide what you are saying and who is saying it."] },

  { id: "present", tag: "2", title: "Now share with the class", mins: 25, kind: "present",
    blurb: ["Present your zine to the class."] },

  { id: "cold", tag: "3", title: "Individual evaluation", mins: 15, kind: "cold",
    blurb: ["You have heard them present, so you know what they are trying to do. Now look at the zine itself and give them suggestions.",
            "Each group reads the next number's group. 1 reads 2, 2 reads 3, 3 reads 4, 4 reads 1. Pick your own group at the top and the right one is chosen for you.",
            "Answer alone, in writing. It saves privately as you type, and nobody sees it until you post."] },

  { id: "saw", tag: "4", title: "What the class saw", mins: 10, kind: "saw",
    blurb: ["Everyone's individual readings."] },

  { id: "role", tag: "5", title: "Role reading", mins: 30, kind: "role",
    blurb: ["In your breakout group, take one role at a time. Whoever holds that role does the typing.",
            "Everyone else contributes out loud or in the chat. Talk it through before anything is written, and type what the group agreed."] },
  { id: "back", tag: "6", title: "Back together", mins: 15, kind: "back",
    blurb: ["Everyone back in the main class. Each group says one thing they are going to change, taken from the role reading in step 5.",
            "Write it first, specify who is saying it, then share."] },
  { id: "ask", tag: "7", title: "Push it further", mins: 20, kind: "ask",
    blurb: ["A board for the whole class. Everyone writes at once, about any zine including your own.",
            "How do we make these more engaging, sharper, more provocative, more worth reading? Post ideas, read everyone else's, vote for the ones you want to see happen."] },
  { id: "commit", tag: "8", title: "Work on your parts", mins: 35, kind: "commit",
    blurb: ["Back in your breakout group. Work on the zine.",
            "At the end, upload a picture of something you made during this time."] }
];

/* ---------------------------------------------------------- helpers */
const $ = (id) => document.getElementById(id);
function el(t, c, x) {
  const e = document.createElement(t);
  if (c) e.className = c;
  if (x != null) e.textContent = x;
  return e;
}
const timers = {};
function debounce(k, fn, ms) { clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }
function lsGet(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function status(t, ok) {
  const s = $("status");
  s.textContent = t; s.className = "status" + (ok ? " ok" : "");
}
const groupList = Array.isArray(GROUPS)
  ? GROUPS.slice()
  : Array.from({ length: GROUPS }, (_, i) => String(i + 1));

let db = null, uid = null, app = null, auth = null;
let me = { name: "", group: "", reading: "" };
let lens = lsGet("talk-lens", "group");
let cur = 0;
let draft = {}, gdoc = {}, readers = [], notes = {}, shots = {}, allGroups = {};
let asks = [], votes = {}, pushes = {}, allNotes = {};
let unsubs = [];

/* ---------------------------------------------------------- paths */
const talkGroup = (g) => collection(db, "rooms/" + TALK_ROOM + "/groups/" + g + "/members");
const talkNotes = (g) => collection(db, "rooms/" + TALK_ROOM + "/groups/" + g + "/proposals");
const talkDoc   = (g) => doc(db, "rooms/" + TALK_ROOM + "/groups", g);
const privDoc   = ()  => doc(db, "rooms/" + TALK_ROOM + "/private", uid);
const liveProps = (g) => collection(db, "rooms/" + LIVE_ROOM + "/groups/" + g + "/proposals");
const presence  = (g) => collection(db, "rooms/" + TALK_ROOM + "/groups/" + g + "/presence");
const askCol    = ()  => collection(db, "rooms/" + TALK_ROOM + "/groups/class/proposals");

/* ---------------------------------------------------------- boot */
try {
  app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
  onAuthStateChanged(auth, (u) => {
    if (u) { uid = u.uid; status("connected", true); loadPrivate(); resubscribe(); renderStep(); }
  });
  signInAnonymously(auth).catch(() => status("sign-in failed"));
} catch (e) { status("firebase did not start"); }

/* ---------------------------------------------------------- identity */
me.name = lsGet("talk-name", "");
me.group = lsGet("talk-group", "");
me.reading = lsGet("talk-reading", "");
$("name").value = me.name;

function fillSelect(sel, blank, chosen) {
  sel.innerHTML = "";
  const o0 = document.createElement("option");
  o0.value = ""; o0.textContent = blank; sel.appendChild(o0);
  groupList.forEach((g) => {
    const o = document.createElement("option");
    o.value = g; o.textContent = (sel.id === "group" ? "your group " : "reading group ") + g;
    sel.appendChild(o);
  });
  sel.value = chosen || "";
}
fillSelect($("group"), "your group…", me.group);
fillSelect($("reading"), "group you are reading…", me.reading);

$("lens").value = lens;
document.body.className = "lens-" + lens;
$("lens").addEventListener("change", () => {
  lens = $("lens").value;
  lsSet("talk-lens", lens);
  document.body.className = "lens-" + lens;
  renderStep();
});
$("name").addEventListener("input", () => {
  me.name = $("name").value.trim(); lsSet("talk-name", me.name);
  debounce("beat", beat, 600);
});
$("group").addEventListener("change", () => {
  me.group = $("group").value; lsSet("talk-group", me.group);
  if (me.group) {
    const ring = groupList.filter((g) => g !== "Test");
    const i = ring.indexOf(me.group);
    me.reading = i === -1 ? ring[0] : ring[(i + 1) % ring.length];
    $("reading").value = me.reading; lsSet("talk-reading", me.reading);
  }
  resubscribe(); renderStep();
});
$("reading").addEventListener("change", () => {
  me.reading = $("reading").value; lsSet("talk-reading", me.reading);
  resubscribe(); renderStep();
});

/* ---------------------------------------------------------- data */
function loadPrivate() {
  try { draft = JSON.parse(lsGet("talk-draft", "{}")) || {}; } catch (e) { draft = {}; }
}
function saveDraft() {
  if (!db || !uid) return;
  setDoc(privDoc(), { answers: draft, updated: Date.now() })
    .then(() => status("saved privately", true)).catch(() => {});
}
function postCold() {
  if (!db || !uid || !me.reading) { status("pick a group to read"); return; }
  setDoc(doc(talkGroup(me.reading), uid), {
    name: me.name || "Someone", fromGroup: me.group || "",
    answers: draft, updated: Date.now()
  }).then(() => { status("posted", true); lsSet("talk-posted-" + me.reading, "1"); renderStep(); })
    .catch(() => status("not posted"));
}
function writeGroup(g, patch) {
  if (!db || !g) return;
  setDoc(talkDoc(g), patch, { merge: true })
    .then(() => status("saved", true)).catch(() => status("not saved"));
}
function saveNote(g, key, text) {
  if (!db || !uid || !g) return;
  setDoc(doc(talkNotes(g), key + "__" + uid), {
    key: key, uid: uid, name: me.name || "Someone",
    fromGroup: me.group || "", text: text, updated: Date.now()
  }).then(() => status("saved", true)).catch(() => status("not saved"));
}
function shrink(file, cb, maxDim) {
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = maxDim || 900;
      let w = im.width, h = im.height;
      if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
      else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(im, 0, 0, w, h);
      try { cb(c.toDataURL("image/jpeg", 0.78)); } catch (e) { cb(null); }
    };
    im.onerror = () => cb(null);
    im.src = r.result;
  };
  r.onerror = () => cb(null);
  r.readAsDataURL(file);
}

function saveShot(dataUrl, caption, done) {
  if (!db || !uid || !me.group) { status("pick your group first"); if (done) done("no group"); return; }
  if (dataUrl.length > 900000) { if (done) done("too big"); return; }
  const id = "shot__" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + "__" + uid;
  setDoc(doc(talkNotes(me.group), id), {
    key: "shot", uid: uid, name: me.name || "Someone", fromGroup: me.group,
    text: caption || "", img: dataUrl, updated: Date.now()
  }).then(() => { status("posted", true); if (done) done(null); })
    .catch(() => { status("not posted"); if (done) done("failed"); });
}

function removeFrom(col, id, after) {
  if (!db) return;
  deleteDoc(doc(col, id))
    .then(() => { status("removed", true); if (after) after(); })
    .catch(() => status("could not remove"));
}
function removePosted() {
  if (!uid || !me.reading) return;
  removeFrom(talkGroup(me.reading), uid, () => {
    lsSet("talk-posted-" + me.reading, "");
    renderStep();
  });
}
function removeMine(key) {
  if (!me.group || !uid) return;
  removeFrom(talkNotes(me.group), key + "__" + uid, renderStep);
}
function removePush(key) {
  if (!uid) return;
  removeFrom(askCol(), key + "__" + uid, renderStep);
}
function removeAsk(id) {
  removeFrom(askCol(), id, renderStep);
}

function saveMine(key, text) {
  if (!db || !uid || !me.group) { status("pick your group first"); return; }
  setDoc(doc(talkNotes(me.group), key + "__" + uid), {
    key: key, uid: uid, name: me.name || "Someone", fromGroup: me.group,
    text: text, updated: Date.now()
  }).then(() => status("saved", true)).catch(() => status("not saved"));
}
function savePush(key, text) {
  if (!db || !uid) return;
  setDoc(doc(askCol(), key + "__" + uid), {
    key: key, uid: uid, name: me.name || "Someone", fromGroup: me.group || "",
    text: text, updated: Date.now()
  }).then(() => status("saved", true)).catch(() => status("not saved"));
}
function postAsk(text) {
  if (!db || !uid) return;
  const id = "q__" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + "__" + uid;
  setDoc(doc(askCol(), id), {
    key: "q", uid: uid, name: me.name || "Someone", fromGroup: me.group || "",
    text: text, updated: Date.now()
  }).then(() => status("posted", true)).catch(() => status("not posted"));
}
function saveVotes(ids) {
  if (!db || !uid) return;
  setDoc(doc(askCol(), "votes__" + uid), {
    key: "votes", uid: uid, name: me.name || "Someone",
    text: ids.join("|"), updated: Date.now()
  }).then(() => status("saved", true)).catch(() => status("not saved"));
}
function myVotes() { return (votes[uid] || []); }
function voteCount(id) {
  let n = 0;
  Object.keys(votes).forEach((u) => { if (votes[u].indexOf(id) > -1) n++; });
  return n;
}
function topAsks(limit) {
  return asks.slice()
    .map((a) => ({ a: a, n: voteCount(a.id) }))
    .sort((x, y) => y.n - x.n)
    .slice(0, limit || 5);
}

function beat() {
  if (!db || !uid || !me.group || !me.name) return;
  setDoc(doc(presence(me.group), uid), { name: me.name, at: Date.now() }).catch(() => {});
}
setInterval(beat, 30000);

function clearSubs() { unsubs.forEach((f) => { try { f(); } catch (e) {} }); unsubs = []; }

function resubscribe() {
  if (!db || !uid) return;
  clearSubs();

  if (me.reading) {
    unsubs.push(onSnapshot(talkGroup(me.reading), (snap) => {
      readers = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      if (["cold", "saw"].indexOf(STEPS[cur].kind) > -1) renderStep();
    }, () => {}));
    unsubs.push(onSnapshot(liveProps(me.reading), (snap) => {
      shots = {};
      snap.docs.forEach((d) => {
        const v = d.data() || {};
        if (!v.key || !v.img) return;
        (shots[v.key] = shots[v.key] || []).push({ id: d.id, img: v.img, name: v.name, updated: v.updated || 0 });
      });
      if (["cold", "role"].indexOf(STEPS[cur].kind) > -1) renderStep();
    }, () => {}));
    unsubs.push(onSnapshot(talkNotes(me.reading), (snap) => {
      notes = {};
      snap.docs.forEach((d) => {
        const v = d.data() || {};
        if (!v.key) return;
        (notes[v.key] = notes[v.key] || []).push(Object.assign({ id: d.id }, v));
      });
      if (STEPS[cur].kind === "role") renderStep();
    }, () => {}));
  }

  if (me.group) {
    unsubs.push(onSnapshot(talkDoc(me.group), (snap) => {
      gdoc = snap.exists() ? snap.data() : {};
      if (["present", "back", "saw", "prep"].indexOf(STEPS[cur].kind) > -1) applyGroup();
      if (STEPS[cur].kind === "role") renderStep();
    }, () => {}));
    unsubs.push(onSnapshot(presence(me.group), (snap) => {
      const now = Date.now(), live = [];
      snap.docs.forEach((d) => {
        const v = d.data() || {};
        if (v.name && now - (v.at || 0) < 90000) live.push(v.name);
      });
      const h = $("here"); h.innerHTML = "";
      live.forEach((n) => h.appendChild(el("span", "chip" + (n === me.name ? "" : " muted"),
        n === me.name ? n + " (you)" : n)));
    }, () => {}));
    beat();
  }

  unsubs.push(onSnapshot(askCol(), (snap) => {
    asks = []; votes = {}; pushes = {};
    snap.docs.forEach((d) => {
      const v = d.data() || {};
      if (/^p\d+$/.test(String(v.key || ""))) {
        if (String(v.text || "").trim())
          (pushes[v.key] = pushes[v.key] || []).push({ uid: v.uid, name: v.name, fromGroup: v.fromGroup, text: v.text });
      } else if (v.key === "q" && String(v.text || "").trim()) {
        asks.push({ id: d.id, text: v.text, name: v.name, fromGroup: v.fromGroup, updated: v.updated || 0 });
      } else if (v.key === "votes") {
        votes[v.uid] = String(v.text || "").split("|").filter(Boolean);
      }
    });
    asks.sort((a, b) => (a.updated || 0) - (b.updated || 0));
    if (["ask", "role"].indexOf(STEPS[cur].kind) > -1) renderStep();
  }, () => {}));

  groupList.forEach((g) => {
    unsubs.push(onSnapshot(talkNotes(g), (snap) => {
      allNotes[g] = [];
      snap.docs.forEach((d) => {
        const v = d.data() || {};
        if (v.key === "shot" && v.img) allNotes[g].push(Object.assign({ id: d.id }, v));
        else if (["bChange", "working", "heardMine"].indexOf(v.key) > -1
                 && String(v.text || "").trim()) allNotes[g].push(v);
      });
      if (["back", "commit", "saw"].indexOf(STEPS[cur].kind) > -1) renderStep();
    }, () => {}));
    unsubs.push(onSnapshot(talkDoc(g), (snap) => {
      allGroups[g] = snap.exists() ? snap.data() : {};
      if (["commit", "present"].indexOf(STEPS[cur].kind) > -1) renderStep();
    }, () => {}));
  });
}

function applyGroup() {
  document.querySelectorAll("[data-gkey]").forEach((n) => {
    if (document.activeElement === n) return;
    const v = gdoc[n.dataset.gkey];
    if (v != null && n.value !== v) n.value = v;
  });
}
function bindGroup(node, key) {
  node.dataset.gkey = key;
  node.value = gdoc[key] || "";
  node.addEventListener("input", () => {
    const patch = {}; patch[key] = node.value;
    debounce("g-" + key, () => writeGroup(me.group, patch), 700);
  });
}

/* ---------------------------------------------------------- blocks */
function field(label, hint, rows) {
  const w = el("div", "f");
  w.appendChild(el("span", "lbl", label));
  if (hint) w.appendChild(el("span", "hint", hint));
  const t = el("textarea"); t.rows = rows || 2;
  w.appendChild(t);
  return { box: w, input: t };
}
function groupField(key, label, hint, rows) {
  const f = field(label, hint, rows);
  bindGroup(f.input, key);
  return f.box;
}
function pageShots(host) {
  if (!me.reading) { host.appendChild(el("p", "empty", "Pick the group you are reading.")); return; }
  let any = 0;
  const grid = el("div", "shots");
  PAGES.forEach((pg, i) => {
    const list = (shots[STAGE + "pg" + (i + 1)] || []).slice()
      .sort((a, b) => (b.updated || 0) - (a.updated || 0));
    if (!list.length) return;
    any++;
    const c = el("div", "shot");
    const im = el("img"); im.src = list[0].img; im.alt = pg;
    im.addEventListener("click", () => c.classList.toggle("big"));
    c.appendChild(im);
    c.appendChild(el("span", null, pg));
    grid.appendChild(c);
  });
  if (!any) {
    host.appendChild(el("p", "empty",
      "No pages uploaded for group " + me.reading + " at this stage yet."));
    return;
  }
  host.appendChild(grid);
}

/* ---------------------------------------------------------- steps */
function buildCold(host) {
  if (me.group && me.reading) {
    host.appendChild(el("div", "band",
      "You are group " + me.group + ", so you are reading group " + me.reading + "."));
  }
  host.appendChild(el("h3", null, "Group " + (me.reading || "—") + ", as it stands"));
  pageShots(host);

  host.appendChild(el("h3", null, "Your suggestions"));
  COLD.forEach(([k, q], i) => {
    const w = el("div", "q");
    w.appendChild(el("h4", null, (i + 1) + ".  " + q));
    const t = el("textarea"); t.rows = 2;
    t.value = draft[k] || "";
    t.addEventListener("input", () => {
      draft[k] = t.value; lsSet("talk-draft", JSON.stringify(draft));
      debounce("d", saveDraft, 900);
    });
    w.appendChild(t);
    host.appendChild(w);
  });

  const posted = (readers || []).some((r) => r.id === uid);
  const b = el("button", posted ? "ghost" : "primary",
    posted ? "Update my suggestions" : "Post my suggestions");
  b.addEventListener("click", postCold);
  host.appendChild(b);
  if (posted) {
    const rb = el("button", "ghost", "Remove my suggestions");
    rb.style.marginLeft = ".4rem";
    rb.addEventListener("click", removePosted);
    host.appendChild(rb);
  }
  host.appendChild(el("p", "note",
    posted ? "Group " + me.reading + " can see this." : "Nobody sees this until you post."));
}

function buildSaw(host) {
  const sel = el("div", "f");
  sel.appendChild(el("span", "lbl", "SHOWING READINGS OF GROUP " + (me.reading || "—")));
  sel.appendChild(el("span", "hint", "Change the group at the top of the page to read another."));
  host.appendChild(sel);

  const list = (readers || []).filter((r) => r.answers);
  if (!list.length) { host.appendChild(el("p", "empty", "Nothing posted yet.")); }
  COLD.forEach(([k, q], i) => {
    const got = list.filter((r) => String((r.answers || {})[k] || "").trim());
    if (!got.length) return;
    const w = el("div", "q");
    w.appendChild(el("h4", null, (i + 1) + ".  " + q));
    const cards = el("div", "cards");
    got.forEach((r) => {
      const c = el("div", "card" + (r.id === uid ? "" : " other"));
      c.appendChild(el("span", "who", (r.name || "Someone") +
        (r.fromGroup ? "  ·  group " + r.fromGroup : "")));
      c.appendChild(el("div", "tx", r.answers[k]));
      cards.appendChild(c);
    });
    w.appendChild(cards);
    host.appendChild(w);
  });

  if (me.group) {
    host.appendChild(el("h3", null, "What we heard"));
    host.appendChild(el("p", "note",
      "Each of you answers in your own box. Nobody can type over anybody."));

    const w = el("div", "q");
    w.appendChild(el("h4", null,
      "What do you take away from the comments for your group's zine? What are the most important suggestions?"));
    const t = el("textarea"); t.rows = 3;
    t.placeholder = "your answer";
    const mine = (allNotes[me.group] || []).filter((x) => x.uid === uid && x.key === "heardMine")[0];
    t.value = mine ? mine.text : "";
    t.addEventListener("input", () => {
      debounce("heardMine", () => saveMine("heardMine", t.value), 900);
    });
    w.appendChild(t);
    if (mine && String(mine.text || "").trim()) {
      const rb = el("button", "ghost", "Remove mine");
      rb.style.cssText = "margin-top:.4rem;font-size:.72rem;padding:.2rem .5rem";
      rb.addEventListener("click", () => removeMine("heardMine"));
      w.appendChild(rb);
    }
    host.appendChild(w);

    const ours = (allNotes[me.group] || [])
      .filter((x) => x.key === "heardMine" && String(x.text || "").trim());
    if (ours.length) {
      const cards = el("div", "cards");
      ours.forEach((x) => {
        const c = el("div", "card" + (x.uid === uid ? "" : " other"));
        c.appendChild(el("span", "who", (x.name || "Someone") + (x.uid === uid ? "  \u00b7  you" : "")));
        c.appendChild(el("div", "tx", x.text));
        cards.appendChild(c);
      });
      host.appendChild(cards);
    }


  }
}

function buildPrep(host) {
  host.appendChild(el("div", "band",
    "Fifteen minutes. Fill these in together. What you type here is what you present."));
  if (!me.group) { host.appendChild(el("p", "empty", "Pick your group at the top.")); return; }

  host.appendChild(el("h3", null, "What you will present"));
  host.appendChild(el("p", "note", "In this order. Sign up for a speaking part so that everyone shares in the class."));

  [["presDiv", "1.  The divergence",
    "One sentence.", 2],
   ["presWorld", "2.  The world",
    "One sentence.", 2],
   ["presOrg", "3.  The organization",
    "One sentence. What it is and what it makes.", 2],
   ["pOverall", "4.  The overall idea",
    "How those three fit together, so the class can follow everything else.", 3],
   ["pManifesto", "5.  The main parts of the manifesto",
    "Not all ten. The two or three that carry it. Read them out as written.", 3],
   ["pPages", "6.  The plan for the pages",
    "What is on each page, and what is still missing.", 4]
  ].forEach((q) => {
    const w = el("div", "q");
    w.appendChild(el("h4", null, q[1]));
    if (q[2]) w.appendChild(el("p", "note", q[2]));
    const t = el("textarea"); t.rows = q[3];
    bindGroup(t, q[0]);
    w.appendChild(t);
    const sp = field("Who says this one", null, 1);
    sp.input.rows = 1;
    sp.input.placeholder = "one name";
    bindGroup(sp.input, q[0] + "Who");
    w.appendChild(sp.box);
    host.appendChild(w);
  });

  const KEYS = ["presDiv", "presWorld", "presOrg", "pOverall", "pManifesto", "pPages"];
  const named = KEYS.map((k) => String(gdoc[k + "Who"] || "").trim().toLowerCase()).filter(Boolean);
  const uniq = named.filter((n, i) => named.indexOf(n) === i);
  const tally = el("p", "note");
  tally.style.fontWeight = "700";
  tally.textContent = named.length < KEYS.length
    ? (KEYS.length - named.length) + " of " + KEYS.length + " still without a speaker."
    : uniq.length + " people covering " + KEYS.length + " parts. Make sure nobody is left out.";
  host.appendChild(tally);

  host.appendChild(el("h3", null, "What every group is bringing"));
  const cards = el("div", "cards");
  let any = 0;
  groupList.forEach((g) => {
    const d = allGroups[g] || {};
    const bits = [d.presOrg, d.pOverall].map((x) => String(x || "").trim()).filter(Boolean);
    if (!bits.length) return;
    any++;
    const c = el("div", "card");
    c.appendChild(el("span", "who", "GROUP " + g));
    c.appendChild(el("div", "tx", bits.join("\n")));
    cards.appendChild(c);
  });
  if (!any) cards.appendChild(el("p", "empty", "Nothing written yet."));
  host.appendChild(cards);
}

function buildPresent(host) {
  host.appendChild(el("p", "note",
    "Read from what you wrote in step 1. The running order and the speakers are below."));
  if (!me.group) { host.appendChild(el("p", "empty", "Pick your group at the top.")); return; }

  const KEYS = [
    ["presDiv", "The divergence"], ["presWorld", "The world"], ["presOrg", "The organization"],
    ["pOverall", "The overall idea"], ["pManifesto", "The manifesto"],
    ["pPages", "The plan for the pages"]
  ];

  host.appendChild(el("h3", null, "Your running order"));
  KEYS.forEach((k, i) => {
    const v = String(gdoc[k[0]] || "").trim();
    const who = String(gdoc[k[0] + "Who"] || "").trim();
    const c = el("div", "card");
    c.appendChild(el("span", "who", (i + 1) + ".  " + k[1] + (who ? "   \u00b7   " + who : "   \u00b7   nobody yet")));
    c.appendChild(el("div", "tx", v || "\u2014 not written \u2014"));
    host.appendChild(c);
  });

  host.appendChild(el("h3", null, "Everyone else"));
  const cards = el("div", "cards");
  let any = 0;
  groupList.forEach((g) => {
    if (g === me.group) return;
    const d = allGroups[g] || {};
    const bits = [d.presDiv, d.presWorld, d.presOrg].filter((x) => String(x || "").trim());
    if (!bits.length) return;
    any++;
    const c = el("div", "card");
    c.appendChild(el("span", "who", "GROUP " + g));
    c.appendChild(el("div", "tx", bits.join("\n")));
    cards.appendChild(c);
  });
  if (!any) cards.appendChild(el("p", "empty", "Nothing written yet."));
  host.appendChild(cards);
}



function buildRole(host) {
  host.appendChild(el("div", "band",
    "Reading group " + (me.reading || "—") + ". One role at a time. Whoever holds the role types; everyone else talks."));
  pageShots(host);

  const classQ = topAsks(5).filter((x) => x.n > 0);
  if (classQ.length) {
    const cw = el("div", "q");
    cw.appendChild(el("h4", null, "The class's own questions"));
    cw.appendChild(el("p", "note", "Voted for in step 9. Answer these as well as your role's."));
    const ul = el("ul");
    classQ.forEach((x) => ul.appendChild(el("li", null, x.a.text)));
    ul.style.cssText = "margin:.2rem 0 .6rem 1.1rem;padding:0;font-size:.92rem";
    cw.appendChild(ul);
    const t0 = el("textarea"); t0.rows = 3;
    t0.placeholder = "answers for group " + (me.reading || "—");
    const m0 = (notes["classq"] || []).filter((x) => x.uid === uid)[0];
    t0.value = m0 ? m0.text : "";
    t0.addEventListener("input", () => {
      debounce("n-classq", () => saveNote(me.reading, "classq", t0.value), 900);
    });
    cw.appendChild(t0);
    host.appendChild(cw);
  }

  ROLES.forEach((r) => {
    const w = el("div", "q");
    const holder0 = String(gdoc["role_" + r[0]] || "").trim();
    w.appendChild(el("h4", null, r[1] + (holder0 ? "   \u2014   " + holder0 : "")));
    const ul = el("ul");
    r[2].forEach((q) => ul.appendChild(el("li", null, q)));
    ul.style.cssText = "margin:.2rem 0 .6rem 1.1rem;padding:0;font-size:.92rem;color:var(--soft)";
    w.appendChild(ul);

    const holder = String(gdoc["role_" + r[0]] || "").trim();
    const isMine = !holder || holder === me.name;
    const t = el("textarea"); t.rows = 3;
    t.placeholder = isMine
      ? "what the group agreed, for group " + (me.reading || "—")
      : holder + " types this one";
    const mine = (notes[r[0]] || []).filter((x) => x.uid === uid)[0];
    t.value = mine ? mine.text : "";
    if (!isMine) t.readOnly = true;
    t.addEventListener("input", () => {
      debounce("n-" + r[0], () => saveNote(me.reading, r[0], t.value), 900);
    });
    w.appendChild(t);
    if (holder) {
      const tag = el("span", "status");
      tag.style.display = "block"; tag.style.marginTop = ".25rem";
      tag.textContent = isMine ? "you hold this role, so you type" : holder + " types this one";
      w.appendChild(tag);
    }

    const others = (notes[r[0]] || []).filter((x) => x.uid !== uid && String(x.text || "").trim());
    if (others.length) {
      const cards = el("div", "cards");
      others.forEach((x) => {
        const c = el("div", "card other");
        c.appendChild(el("span", "who", (x.name || "Someone") +
          (x.fromGroup ? "  ·  group " + x.fromGroup : "")));
        c.appendChild(el("div", "tx", x.text));
        cards.appendChild(c);
      });
      w.appendChild(cards);
    }
    host.appendChild(w);
  });
}

    ours.forEach((x) => {
      const c = el("div", "card" + (x.uid === uid ? "" : " other"));

}

function buildCommit(host) {
  if (!me.group) { host.appendChild(el("p", "empty", "Pick your group at the top.")); return; }

  const up = el("div", "q");
  up.appendChild(el("h4", null, "Upload what you made"));
  const row = el("div");
  row.style.cssText = "display:flex;gap:.6rem;align-items:center;flex-wrap:wrap";
  const cap = el("input"); cap.type = "text";
  cap.placeholder = "what it is";
  cap.style.cssText = "flex:1 1 14rem";
  const fi = el("input"); fi.type = "file"; fi.accept = "image/*"; fi.multiple = true;
  fi.style.cssText = "flex:0 0 auto;max-width:16rem;font-family:'Bricolage Grotesque',sans-serif;font-size:.78rem";
  const note = el("span", "status", "");
  fi.addEventListener("change", () => {
    const files = Array.prototype.slice.call(fi.files || []);
    if (!files.length) return;
    let done = 0;
    note.textContent = "uploading 0 of " + files.length + "…";
    files.forEach((f) => {
      (function attempt(d) {
        shrink(f, (dataUrl) => {
          if (!dataUrl) { done++; note.textContent = "one image could not be read"; return; }
          if (dataUrl.length > 850000 && d > 400) { attempt(Math.round(d * 0.75)); return; }
          saveShot(dataUrl, cap.value, (err) => {
            if (err === "too big" && d > 350) { attempt(Math.round(d * 0.7)); return; }
            done++;
            note.textContent = done >= files.length ? "uploaded" : "uploading " + done + " of " + files.length + "…";
            if (done >= files.length) { cap.value = ""; fi.value = ""; renderStep(); }
          });
        }, d);
      })(900);
    });
  });
  row.appendChild(cap); row.appendChild(fi); row.appendChild(note);
  up.appendChild(row);
  host.appendChild(up);

  groupList.forEach((g) => {
    const shots = (allNotes[g] || []).filter((x) => x.key === "shot" && x.img)
      .sort((a, b) => (b.updated || 0) - (a.updated || 0));
    if (!shots.length) return;
    const gw = el("div", "q" + (g === me.group ? "" : " othergroup"));
    gw.appendChild(el("h4", null, "Group " + g + (g === me.group ? "   \u2014   yours" : "")));
    const grid = el("div", "shots");
    shots.forEach((x) => {
      const c = el("div", "shot" + (x.uid === uid ? "" : " other"));
      const im = el("img"); im.src = x.img; im.alt = x.text || "update";
      im.style.cursor = "zoom-in";
      im.addEventListener("click", () => c.classList.toggle("big"));
      c.appendChild(im);
      c.appendChild(el("span", null, (x.text ? x.text + "  \u00b7  " : "") + (x.name || "Someone")));
      if (x.uid === uid) {
        const rb = el("button", "ghost", "Remove");
        rb.style.cssText = "width:100%;margin-top:.25rem;font-size:.66rem;padding:.15rem .3rem";
        rb.addEventListener("click", () => removeFrom(talkNotes(g), x.id, renderStep));
        c.appendChild(rb);
      }
      grid.appendChild(c);
    });
    gw.appendChild(grid);
    host.appendChild(gw);
  });

  const total = groupList.reduce((n, g) =>
    n + (allNotes[g] || []).filter((x) => x.key === "shot" && x.img).length, 0);
  if (!total) host.appendChild(el("p", "empty", "Nothing uploaded yet."));
}

const PUSH = [
  ["p1", "What are some of the most interesting ideas from today and how can they be pushed even further?"],
  ["p2", "What are some things that feel safe and can be pushed further?"],
  ["p3", "What would make one of these really provocative in a good way?"],
  ["p4", "What has nobody tried yet?"],
  ["p5", "What is the strangest thing you would want to see in one of these zines?"],
  ["p6", "Which world would be more interesting if it were worse? Or better?"],
  ["p7", "What would you put on a page if nobody was grading it?"],
  ["p8", "What would make one of these worth keeping after the class ends?"]
];

function buildAsk(host) {
  host.appendChild(el("div", "band",
    "How can we make these the most engaging that they can be?"));
  host.appendChild(el("p", "note",
    "Everyone answers at the same time, about any zine including your own. Name the group if it is about one in particular. Your answers appear to the class as you type."));

  PUSH.forEach((q) => {
    const w = el("div", "q");
    w.appendChild(el("h4", null, q[1]));

    const t = el("textarea"); t.rows = 2;
    t.placeholder = "your answer";
    const mine = (pushes[q[0]] || []).filter((x) => x.uid === uid)[0];
    t.value = mine ? mine.text : "";
    t.addEventListener("input", () => {
      debounce("push-" + q[0], () => savePush(q[0], t.value), 900);
    });
    w.appendChild(t);
    if (mine && String(mine.text || "").trim()) {
      const rb = el("button", "ghost", "Remove mine");
      rb.style.cssText = "margin-top:.4rem;font-size:.72rem;padding:.2rem .5rem";
      rb.addEventListener("click", () => removePush(q[0]));
      w.appendChild(rb);
    }

    const others = (pushes[q[0]] || []).filter((x) => x.uid !== uid);
    if (others.length) {
      const cards = el("div", "cards");
      others.forEach((x) => {
        const c = el("div", "card other");
        c.appendChild(el("span", "who", (x.name || "Someone") +
          (x.fromGroup ? "  \u00b7  group " + x.fromGroup : "")));
        c.appendChild(el("div", "tx", x.text));
        cards.appendChild(c);
      });
      w.appendChild(cards);
    }
    host.appendChild(w);
  });

  host.appendChild(el("h3", null, "Anything else"));
  const w2 = el("div", "q");
  w2.appendChild(el("p", "note",
    "An idea that does not fit any of the questions above. These get voted on."));
  const t2 = el("textarea"); t2.rows = 2;
  t2.placeholder = "e.g. Group 3: let the organization lose the argument on the last page.";
  const b = el("button", "primary", "Post it");
  b.style.marginTop = ".5rem";
  b.addEventListener("click", () => {
    const v = t2.value.trim();
    if (!v) { status("write something first"); return; }
    postAsk(v); t2.value = "";
  });
  w2.appendChild(t2); w2.appendChild(b);
  host.appendChild(w2);

  const mineV = myVotes();
  const list = asks.slice()
    .map((a) => ({ a: a, n: voteCount(a.id) }))
    .sort((x, y) => y.n - x.n || (y.a.updated - x.a.updated));
  list.forEach((row) => {
    const on = mineV.indexOf(row.a.id) > -1;
    const c = el("div", "card" + (row.a.id.endsWith("__" + uid) ? "" : " other"));
    c.style.display = "flex"; c.style.gap = ".6rem"; c.style.alignItems = "flex-start";
    const vb = el("button", on ? "primary" : "ghost", on ? "Voted \u2713" : "Vote");
    vb.style.cssText = "flex:0 0 auto;font-size:.7rem;padding:.2rem .5rem;min-width:4.6rem";
    vb.addEventListener("click", () => {
      const ids = myVotes().slice();
      const at = ids.indexOf(row.a.id);
      if (at > -1) ids.splice(at, 1); else ids.push(row.a.id);
      votes[uid] = ids;
      saveVotes(ids);
      renderStep();
    });
    const mid = el("div"); mid.style.flex = "1 1 auto";
    mid.appendChild(el("span", "who", (row.a.name || "Someone") +
      (row.a.fromGroup ? "  \u00b7  group " + row.a.fromGroup : "")));
    mid.appendChild(el("div", "tx", row.a.text));
    const cnt = el("span", "who", row.n ? String(row.n) : "");
    cnt.style.cssText = "flex:0 0 auto;font-size:.95rem;color:var(--olivelt);min-width:1.4rem;text-align:right";
    c.appendChild(vb); c.appendChild(mid); c.appendChild(cnt);
    if (row.a.id.endsWith("__" + uid)) {
      const rb = el("button", "ghost", "Remove");
      rb.style.cssText = "flex:0 0 auto;font-size:.7rem;padding:.2rem .5rem";
      rb.addEventListener("click", () => removeAsk(row.a.id));
      c.appendChild(rb);
    }
    host.appendChild(c);
  });
}

/* ---------------------------------------------------------- timer */
let tLeft = 0, tId = null;
function buildTimer(host, mins) {
  const w = el("div", "timer");
  const clock = el("span", "clock", "00:00");
  const start = el("button", "primary", "Start " + mins + " min");
  const stop = el("button", "ghost", "Stop");
  function paint() {
    const m = Math.floor(tLeft / 60), s = tLeft % 60;
    clock.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    clock.className = "clock" + (tLeft > 0 && tLeft <= 120 ? " low" : "");
  }
  start.addEventListener("click", () => {
    clearInterval(tId); tLeft = mins * 60; paint();
    tId = setInterval(() => { tLeft--; paint(); if (tLeft <= 0) clearInterval(tId); }, 1000);
  });
  stop.addEventListener("click", () => { clearInterval(tId); tLeft = 0; paint(); });
  paint();
  w.appendChild(clock); w.appendChild(start); w.appendChild(stop);
  w.appendChild(el("span", "status", "suggested length, not a rule"));
  host.appendChild(w);
}

/* ---------------------------------------------------------- render */
function renderStep() {
  const s = STEPS[cur];
  const host = $("step");
  host.innerHTML = "";
  host.appendChild(el("p", "status", "STEP " + s.tag));
  host.appendChild(el("p", "lensnote",
    "Showing only what you wrote. Switch the view at the top to see the rest of the class."));
  host.appendChild(el("h2", null, s.title));
  (s.blurb || []).forEach((t) => host.appendChild(el("p", null, t)));
  buildTimer(host, s.mins);

  if (!uid) { host.appendChild(el("div", "warn", "Connecting…")); }
  else if (s.kind === "cold") buildCold(host);
  else if (s.kind === "saw") buildSaw(host);
  else if (s.kind === "prep") buildPrep(host);
  else if (s.kind === "present") buildPresent(host);
  else if (s.kind === "role") buildRole(host);
  else if (s.kind === "back") buildBack(host);
  else if (s.kind === "ask") buildAsk(host);
  else if (s.kind === "commit") buildCommit(host);

  renderNav();
  applyGroup();
  try { window.scrollTo(0, 0); } catch (e) {}
}

function doneKey(id) { return "talk-done-" + id; }
function renderNav() {
  const nav = $("nav"); nav.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = el("button", lsGet(doneKey(s.id), "") === "1" ? "done" : null, s.tag);
    b.title = s.title;
    b.setAttribute("aria-current", i === cur ? "true" : "false");
    b.addEventListener("click", () => { cur = i; renderStep(); });
    nav.appendChild(b);
  });
  const n = STEPS.filter((s) => lsGet(doneKey(s.id), "") === "1").length;
  $("prog").textContent = n + " of " + STEPS.length + " done";
  $("mark").textContent = lsGet(doneKey(STEPS[cur].id), "") === "1"
    ? "Done ✓" : "Mark this step done";
  $("prev").disabled = cur === 0;
  $("next").textContent = cur === STEPS.length - 1 ? "End" : "Next →";
}

$("prev").addEventListener("click", () => { if (cur > 0) { cur--; renderStep(); } });
$("next").addEventListener("click", () => { if (cur < STEPS.length - 1) { cur++; renderStep(); } });
$("mark").addEventListener("click", () => {
  const k = doneKey(STEPS[cur].id);
  lsSet(k, lsGet(k, "") === "1" ? "" : "1");
  renderNav();
});
$("pdf").addEventListener("click", () => window.print());
$("pdfall").addEventListener("click", () => {
  const host = $("step");
  const keep = cur;
  const all = document.createElement("div");
  for (let i = 0; i < STEPS.length; i++) {
    cur = i;
    renderStep();
    const sec = document.createElement("section");
    if (i > 0) sec.className = "stepbreak";
    while (host.firstChild) sec.appendChild(host.firstChild);
    all.appendChild(sec);
  }
  host.appendChild(all);
  window.print();
  cur = keep;
  renderStep();
});

renderStep();
</script>
